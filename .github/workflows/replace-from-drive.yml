name: Replace repository from Google Drive

on:
  push:
    paths:
      - '.github/workflows/replace-from-drive.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Google Drive folder
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q gdown
          python - <<'PY'
          import os
          import gdown
          url = 'https://drive.google.com/drive/folders/17Nxsc3cyB9IUXHwT6rTE_V1gFdg3NF4P?usp=drive_link'
          out = '/tmp/drive-src'
          os.makedirs(out, exist_ok=True)
          files = gdown.download_folder(url=url, output=out, quiet=False, use_cookies=False)
          if not files:
              raise SystemExit('Google Drive folder download returned no files')
          print(f'Downloaded {len(files)} files')
          PY

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/drive-src
          if [ ! -f "$src/README.md" ]; then
            nested="$(find "$src" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$nested" ] && [ -f "$nested/README.md" ]; then
              src="$nested"
            fi
          fi
          test -f "$src/README.md"
          test -f "$src/main.py"
          test -f "$src/ai/providers/gemini_web.py"
          test -f "$src/tgbot/handlers_admin.py"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. .

          file_count="$(find . -type f ! -path './.git/*' | wc -l | tr -d ' ')"
          echo "Files after replacement: $file_count"
          test "$file_count" = "23"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f
          git commit -m 'Replace repository with Google Drive contents'
          git push origin HEAD:main
